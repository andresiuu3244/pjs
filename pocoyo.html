<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f3ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>Per Ali 🫶🏻</title>

  <link rel="preconnect" href="https://media.tenor.com">
  <link rel="preconnect" href="https://media1.tenor.com">
  <link rel="preconnect" href="https://media.giphy.com">

  <style>
    :root {
      --background: #f7f3ed;
      --card: rgba(255, 255, 255, 0.88);
      --text: #1d1d1f;
      --muted: #6d6964;
      --purple: #7161e8;
      --purple-dark: #5a49d2;
      --purple-soft: #eeeaff;
      --border: rgba(29, 29, 31, 0.09);
      --shadow: 0 24px 65px rgba(42, 35, 28, 0.13);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 12%,
          rgba(255, 211, 175, 0.55),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 78%,
          rgba(196, 187, 255, 0.56),
          transparent 38%
        ),
        var(--background);

      overflow-x: hidden;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .screen {
      width: min(100%, 460px);

      animation:
        screen-enter
        500ms
        cubic-bezier(0.2, 0.8, 0.2, 1)
        both;
    }

    .screen[hidden] {
      display: none !important;
    }

    .card {
      position: relative;

      width: 100%;
      padding: 30px 22px;

      overflow: hidden;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 30px;

      background: var(--card);
      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      background:
        linear-gradient(
          90deg,
          #ffae78,
          #8b78f3
        );
    }

    .card--question,
    .card--final {
      padding-top: 76px;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--purple);

      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;

      line-height: 1.03;
      letter-spacing: -0.05em;
    }

    h1 {
      font-size: clamp(2.5rem, 12vw, 3.7rem);
    }

    h2 {
      font-size: clamp(2.05rem, 9.5vw, 3.3rem);
    }

    .lead {
      margin: 18px 0 24px;

      color: var(--muted);

      font-size: 1.07rem;
      font-weight: 650;
      line-height: 1.45;
    }

    /* Pulsante Pocoyo */

    .pocoyo-button {
      display: grid;
      gap: 14px;

      width: min(100%, 310px);
      margin: 0 auto;
      padding: 0;

      border: 0;
      background: transparent;

      cursor: pointer;
    }

    .pocoyo-button:active .gif-box {
      transform: scale(0.97) rotate(-1deg);
    }

    .gif-box {
      display: block;

      width: 100%;
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 24px;

      background:
        radial-gradient(
          circle,
          #ffffff,
          #f7f5ff
        );

      box-shadow:
        0 15px 38px rgba(30, 30, 30, 0.12);

      transition: transform 180ms ease;
    }

    .gif-box--square {
      aspect-ratio: 1 / 1;
    }

    .gif-box img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .tap-label {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 54px;
      padding: 0 24px;

      border-radius: 999px;

      color: white;
      background: var(--text);

      font-size: 1.02rem;
      font-weight: 850;

      box-shadow:
        0 10px 25px rgba(30, 30, 30, 0.18);
    }

    /* Pulsante indietro */

    .back-button {
      position: absolute;
      top: 20px;
      left: 18px;
      z-index: 10;

      min-height: 40px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--muted);
      background: rgba(255, 255, 255, 0.82);

      font-size: 0.88rem;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(30, 30, 30, 0.08);
    }

    .back-button:active {
      transform: scale(0.95);
    }

    /* Informazioni uscita */

    .details {
      margin: 25px 0 14px;
      padding: 18px 17px;

      border-radius: 21px;

      background: var(--purple-soft);

      text-align: left;
    }

    .details-label {
      color: var(--purple-dark);

      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .details p {
      margin: 8px 0 0;

      font-size: 1.08rem;
      font-weight: 750;
      line-height: 1.4;
    }

    .feedback {
      min-height: 26px;
      margin: 14px 0 4px;

      color: #b2445b;

      font-size: 0.97rem;
      font-weight: 850;
    }

    /* Bottoni sì e no */

    .actions {
      position: relative;

      min-height: 175px;
      margin-top: 6px;
      padding-top: 8px;
    }

    .button {
      min-height: 54px;

      border: 0;
      border-radius: 18px;

      font-size: 1rem;
      font-weight: 850;

      cursor: pointer;

      transition:
        transform 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button--yes {
      position: relative;
      z-index: 2;

      width: 100%;
      padding: 0 20px;

      color: white;
      background: var(--purple);

      box-shadow:
        0 11px 27px rgba(113, 97, 232, 0.35);
    }

    .button--yes:active {
      background: var(--purple-dark);
    }

    .button--no {
      position: absolute;
      left: 50%;
      bottom: 8px;
      z-index: 3;

      width: 100px;
      min-height: 50px;
      padding: 0 15px;

      transform: translateX(-50%);

      color: var(--muted);
      background: #ece9e4;

      box-shadow:
        0 7px 18px rgba(30, 30, 30, 0.09);

      will-change: left, top, transform;
    }

    .button--no.is-moving {
      transform: none;
    }

    /* Schermata finale */

    .final-gif {
      width: 100%;
      margin-top: 24px;
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 23px;

      background: white;

      box-shadow:
        0 15px 38px rgba(30, 30, 30, 0.12);

      opacity: 0;
      transform: translateY(12px) scale(0.97);

      animation:
        final-gif-enter
        650ms
        150ms
        cubic-bezier(0.18, 0.9, 0.25, 1.15)
        forwards;
    }

    .final-gif img {
      display: block;

      width: 100%;
      aspect-ratio: 498 / 336;

      object-fit: cover;
    }

    .final-reveal {
      max-height: 0;
      overflow: hidden;

      opacity: 0;
      transform: translateY(20px);

      transition:
        opacity 550ms ease,
        transform 550ms ease,
        max-height 850ms ease;
    }

    .final-reveal.is-visible {
      max-height: 600px;

      opacity: 1;
      transform: translateY(0);
    }

    .final-message {
      margin: 26px 0 14px;

      font-size: clamp(1.65rem, 7vw, 2.25rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .party-gif {
      display: block;

      width: min(72%, 240px);
      height: auto;
      margin: 0 auto;

      object-fit: contain;
    }

    .final-note {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 0.9rem;
      font-weight: 750;
    }

    /* Emoji che cadono */

    .confetti {
      position: fixed;
      top: -40px;
      z-index: 100;

      pointer-events: none;

      font-size: clamp(20px, 6vw, 30px);

      animation:
        confetti-fall
        1800ms
        linear
        forwards;
    }

    @keyframes screen-enter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes final-gif-enter {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes confetti-fall {
      0% {
        opacity: 0;
        transform:
          translate3d(0, -10px, 0)
          rotate(0deg);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(
            var(--horizontal-movement),
            110vh,
            0
          )
          rotate(520deg);
      }
    }

    @media (min-width: 520px) {
      .card {
        padding-right: 34px;
        padding-left: 34px;
      }

      .card--question,
      .card--final {
        padding-top: 76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" aria-live="polite">

    <!-- SCHERMATA INIZIALE -->

    <section
      class="screen"
      id="welcomeScreen"
      aria-labelledby="welcomeTitle"
    >
      <div class="card">
        <p class="eyebrow">una cosa veloce per te</p>

        <h1 id="welcomeTitle">
          Ehi Ali 🫶🏻
        </h1>

        <p class="lead">
          clicca su Pocoyo per continuare
        </p>

        <button
          class="pocoyo-button"
          id="startButton"
          type="button"
          aria-label="Clicca su Pocoyo per continuare"
        >
          <span class="gif-box gif-box--square">
            <img
              src="https://media.tenor.com/VnmaGdolZnwAAAAj/pocoyo-pocoyo-dance.gif"
              alt="Pocoyo che balla"
              width="498"
              height="498"
              loading="eager"
              decoding="async"
              fetchpriority="high"
            >
          </span>

          <span class="tap-label">
            tocca qui
          </span>
        </button>
      </div>
    </section>

    <!-- SCHERMATA DOMANDA -->

    <section
      class="screen"
      id="questionScreen"
      aria-labelledby="questionTitle"
      hidden
    >
      <div class="card card--question">

        <button
          class="back-button"
          id="backToWelcome"
          type="button"
          aria-label="Torna alla schermata iniziale"
        >
          ← indietro
        </button>

        <p class="eyebrow">
          domanda importantissima
        </p>

        <h2 id="questionTitle">
          che dici usciamo finalmente?🙃
        </h2>

        <div class="details">
          <span class="details-label">
            dove e quando:
          </span>

          <p>
            quando vuoi basta che ci vediamo🗣️🔥
          </p>
        </div>

        <p
          class="feedback"
          id="feedback"
          aria-live="assertive"
        ></p>

        <div class="actions" id="actions">

          <button
            class="button button--yes"
            id="yesButton"
            type="button"
          >
            sì, ci sto 🫶🏻
          </button>

          <button
            class="button button--no"
            id="noButton"
            type="button"
          >
            no
          </button>

        </div>
      </div>
    </section>

    <!-- SCHERMATA FINALE -->

    <section
      class="screen"
      id="finalScreen"
      aria-labelledby="finalTitle"
      hidden
    >
      <div class="card card--final">

        <button
          class="back-button"
          id="backToQuestion"
          type="button"
          aria-label="Torna alla domanda"
        >
          ← indietro
        </button>

        <p class="eyebrow">
          ottima scelta
        </p>

        <h2 id="finalTitle">
          LO SAPEVO 🫶🏻
        </h2>

        <div class="final-gif" id="finalMainGif">
          <img
            src="https://media1.tenor.com/m/ew_c7J9LQtsAAAAd/i-used-to-pray-for-times-like-this.gif"
            alt="I used to pray for times like this"
            loading="eager"
            decoding="async"
          >
        </div>

        <div
          class="final-reveal"
          id="finalReveal"
          aria-hidden="true"
        >
          <p class="final-message">
            allora ci sentiamo bellissima🙃🙃
          </p>

          <img
            class="party-gif"
            src="https://media.giphy.com/media/FOw9h3t7oWm34HOuQr/giphy.gif"
            alt="Pocoyo che festeggia"
            loading="eager"
            decoding="async"
          >

          <p class="final-note">
            missione compiuta 🫶🏻
          </p>
        </div>
      </div>
    </section>

  </main>

  <noscript>
    Per vedere la sorpresa devi attivare JavaScript.
  </noscript>

  <script>
    const screens = {
      welcome: document.getElementById("welcomeScreen"),
      question: document.getElementById("questionScreen"),
      final: document.getElementById("finalScreen")
    };

    const startButton =
      document.getElementById("startButton");

    const yesButton =
      document.getElementById("yesButton");

    const noButton =
      document.getElementById("noButton");

    const actions =
      document.getElementById("actions");

    const feedback =
      document.getElementById("feedback");

    const backToWelcome =
      document.getElementById("backToWelcome");

    const backToQuestion =
      document.getElementById("backToQuestion");

    const finalReveal =
      document.getElementById("finalReveal");

    const finalMainGif =
      document.getElementById("finalMainGif");

    const noMessages = [
      "risposta sbagliata, riprova 🙃",
      "quel bottone non funziona, strano...",
      "Ali dai, non fare così",
      "il no è momentaneamente fuori servizio",
      "ormai ti rimane solamente il sì 🫶🏻"
    ];

    let noAttempts = 0;
    let revealTimer = null;
    let noButtonLocked = false;

    function showScreen(screenName) {
      Object.entries(screens).forEach(
        ([name, screen]) => {
          screen.hidden = name !== screenName;
        }
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function resetQuestion() {
      noAttempts = 0;

      feedback.textContent = "";

      noButton.classList.remove("is-moving");

      noButton.style.left = "";
      noButton.style.top = "";
      noButton.style.bottom = "";
      noButton.style.transform = "";
      noButton.style.scale = "";

      yesButton.style.transform = "";
    }

    function resetFinal() {
      window.clearTimeout(revealTimer);

      finalReveal.classList.remove("is-visible");
      finalReveal.setAttribute(
        "aria-hidden",
        "true"
      );

      document
        .querySelectorAll(".confetti")
        .forEach((emoji) => emoji.remove());
    }

    function restartFinalAnimation() {
      finalMainGif.style.animation = "none";

      void finalMainGif.offsetWidth;

      finalMainGif.style.animation = "";
    }

    function moveNoButton() {
      if (noButtonLocked) {
        return;
      }

      noButtonLocked = true;

      window.setTimeout(() => {
        noButtonLocked = false;
      }, 120);

      const areaWidth = actions.clientWidth;
      const areaHeight = actions.clientHeight;

      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const padding = 8;
      const minimumY = 75;

      const maximumX = Math.max(
        padding,
        areaWidth - buttonWidth - padding
      );

      const maximumY = Math.max(
        minimumY,
        areaHeight - buttonHeight - padding
      );

      const randomX =
        padding +
        Math.random() * (maximumX - padding);

      const randomY =
        minimumY +
        Math.random() * (maximumY - minimumY);

      noButton.classList.add("is-moving");

      noButton.style.left = `${randomX}px`;
      noButton.style.top = `${randomY}px`;
      noButton.style.bottom = "auto";
      noButton.style.transform = "none";

      feedback.textContent =
        noMessages[
          Math.min(
            noAttempts,
            noMessages.length - 1
          )
        ];

      noAttempts += 1;

      const noScale = Math.max(
        0.65,
        1 - noAttempts * 0.055
      );

      const yesScale = Math.min(
        1.08,
        1 + noAttempts * 0.012
      );

      noButton.style.scale = noScale;

      yesButton.style.transform =
        `scale(${yesScale})`;
    }

    function createConfetti() {
      const emojis = [
        "🫶🏻",
        "🔥",
        "🙃",
        "✨"
      ];

      for (
        let index = 0;
        index < 20;
        index += 1
      ) {
        const emoji =
          document.createElement("span");

        emoji.className = "confetti";

        emoji.textContent =
          emojis[index % emojis.length];

        emoji.style.left =
          `${Math.random() * 100}vw`;

        emoji.style.setProperty(
          "--horizontal-movement",
          `${Math.random() * 150 - 75}px`
        );

        emoji.style.animationDelay =
          `${Math.random() * 450}ms`;

        document.body.appendChild(emoji);

        window.setTimeout(() => {
          emoji.remove();
        }, 2500);
      }
    }

    startButton.addEventListener(
      "click",
      () => {
        resetQuestion();
        showScreen("question");
      }
    );

    backToWelcome.addEventListener(
      "click",
      () => {
        resetQuestion();
        showScreen("welcome");
      }
    );

    backToQuestion.addEventListener(
      "click",
      () => {
        resetFinal();
        resetQuestion();
        showScreen("question");
      }
    );

    yesButton.addEventListener(
      "click",
      () => {
        resetFinal();

        showScreen("final");
        restartFinalAnimation();
        createConfetti();

        revealTimer = window.setTimeout(
          () => {
            finalReveal.classList.add(
              "is-visible"
            );

            finalReveal.setAttribute(
              "aria-hidden",
              "false"
            );
          },
          1800
        );
      }
    );

    noButton.addEventListener(
      "pointerdown",
      (event) => {
        event.preventDefault();
        moveNoButton();
      }
    );

    noButton.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();
          moveNoButton();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        if (
          noButton.classList.contains(
            "is-moving"
          )
        ) {
          moveNoButton();
        }
      }
    );
  </script>
</body>
</html>
